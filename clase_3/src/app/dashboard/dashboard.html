<div class="row m-0">
  
  <div class="col-2 bg-light vh-100 p-3 d-flex flex-column">
    
 
    <div class="text-center mb-4">
      <img [src]="usuario.fotoUrl" alt="Foto perfil" class="rounded-circle mb-2" width="80" height="80">
      <h6>{{ usuario.nombre }}</h6>
    </div>

    <h5 class="mb-3">somos mascostas</h5>
    <ul class="nav flex-column">
      <li class="nav-item"><a class="nav-link" href="#">mural</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Publicaciones</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Amigos</a></li>
      <li class="nav-item"><a class="nav-link" href="#">Configuración</a></li>
    </ul>

  </div>


  <div class="col-10 p-4">
   
    <ul class="nav nav-tabs" id="myTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="inicio-tab" data-bs-toggle="tab" data-bs-target="#inicio" type="button" role="tab">
          Inicio
        </button>
      </li>
   

   
    <div class="tab-content p-3 border border-top-0 rounded-bottom bg-white" id="myTabContent">
      
      
      <div class="tab-pane fade show active" id="inicio" role="tabpanel">
        <h2>Publicaciones</h2>
        <div *ngFor="let post of publicaciones" class="card mb-3">
          <div class="card-body">
            <h5 class="card-title">{{ post.usuario }}</h5>
            <img [src]="post.imagenUrl" alt="foto" class="img-fluid mb-2" style="max-width: 200px;">
            <p class="card-text">{{ post.texto }}</p>
            <button class="btn btn-sm btn-outline-primary me-2" (click)="darLike(post)">👍 {{ post.likes }}</button>
            <button class="btn btn-sm btn-outline-secondary" (click)="verDetalle(post)" data-bs-toggle="tab" data-bs-target="#detalle">comentario</button>
        </div>
      </div>

     
      <div class="tab-pane fade" id="detalle" role="tabpanel">
        <div *ngIf="publicacionActiva">
          <h3>{{ publicacionActiva.usuario }}</h3>
          <img [src]="publicacionActiva.imagenUrl" alt="foto" class="img-fluid mb-2" style="max-width: 200px;">
          <p>{{ publicacionActiva.texto }}</p>
          <p><strong>Likes:</strong> {{ publicacionActiva.likes }}</p>
        
        </div>
      </div>
  </div>
